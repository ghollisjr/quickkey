# quickkey config
#
# Each [section] is a Name shown in the menu; its `command` is run with the
# shell and whatever it writes to stdout goes onto the clipboard.
#
# Copy this to ~/.config/quickkey/config to make it the default.

[Public IP]
command = curl -s https://ifconfig.me

[Today's date]
command = date +%Y-%m-%d

[Timestamp]
command = date --iso-8601=seconds

[UUID]
command = cat /proc/sys/kernel/random/uuid

[Password (24 chars)]
command = tr -dc 'A-Za-z0-9!@#$%^&*' < /dev/urandom | head -c 24

[Current branch]
command = git -C ~/myprogs/quickkey rev-parse --abbrev-ref HEAD

[Hostname]
command = hostname -f
